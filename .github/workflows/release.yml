name: Release

on:
  push:
    tags:
      - "*.*.*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Validate tag and manifest versions
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail

          if [[ ! "$TAG_NAME" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Release tag must be plain semver with no v prefix: $TAG_NAME" >&2
            exit 1
          fi

          PACKAGE_VERSION=$(node -p "require('./package.json').version")
          MANIFEST_VERSION=$(node -p "require('./manifest.json').version")

          if [[ "$PACKAGE_VERSION" != "$TAG_NAME" ]]; then
            echo "package.json version ($PACKAGE_VERSION) does not match tag ($TAG_NAME)" >&2
            exit 1
          fi

          if [[ "$MANIFEST_VERSION" != "$TAG_NAME" ]]; then
            echo "manifest.json version ($MANIFEST_VERSION) does not match tag ($TAG_NAME)" >&2
            exit 1
          fi

      - name: Install dependencies
        run: npm ci

      - name: Build release artifacts
        run: npm run build

      - name: Validate release assets and notes
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail

          for asset in main.js manifest.json styles.css; do
            if [[ ! -f "$asset" ]]; then
              echo "Missing required release asset: $asset" >&2
              exit 1
            fi
          done

          node scripts/extract-changelog-entry.mjs "$TAG_NAME" > release-notes.md

      - name: Create GitHub release
        env:
          GITHUB_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail

          if gh release view "$TAG_NAME" >/dev/null 2>&1; then
            echo "GitHub Release already exists for $TAG_NAME" >&2
            exit 1
          fi

          gh release create "$TAG_NAME" main.js manifest.json styles.css \
            --title "$TAG_NAME" \
            --notes-file release-notes.md
